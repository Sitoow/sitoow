<!-- ⚙️ SCRIPT LOGIQUE SUPABASE (VERSION REDIRECTION AUTOMATIQUE) -->
<script>
    // 1. Tes clés Supabase
    const SUPABASE_URL = "https://kiarcshzgolzncdidnpj.supabase.co"; // Remplace par ton URL
    const SUPABASE_KEY = "sb_publishable_oWotd3kAm3ub2oAl-tHDIw_QoZzPg3R"; // Ta clef publishable

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isAdmin = false;

    // 2. Initialisation au chargement de la page
    async function init() {
        const { data } = await _supabase.auth.getSession();
        if (data && data.session) {
            setAdminMode(true);
        } else {
            setAdminMode(false);
        }
        loadVideos();
    }

    // Affiche/Masque la barre d'administration sur le site
    function setAdminMode(active) {
        isAdmin = active;
        const adminBar = document.getElementById('admin-bar');
        const loginBtn = document.getElementById('login-trigger-btn');
        
        if (adminBar) adminBar.style.display = active ? 'block' : 'none';
        if (loginBtn) loginBtn.style.display = active ? 'none' : 'inline-block';
        
        // Affiche ou masque les boutons "Supprimer" sur les cartes de vidéos
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.style.display = active ? 'inline-block' : 'none';
        });
    }

    // 3. Fonction de Connexion avec Fermeture + Redirection automatique
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const err = document.getElementById('login-error');

        err.innerText = "Connexion en cours...";

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            err.innerText = "Identifiants incorrects !";
        } else {
            // Ferme la pop-up de connexion
            closeLoginModal();
            // Active le mode admin sur le site
            setAdminMode(true);
            // Recharge la liste des vidéos
            loadVideos();
            // Recharge la page pour nettoyer l'interface
            window.location.reload();
        }
    }

    // 4. Déconnexion
    async function logout() {
        await _supabase.auth.signOut();
        setAdminMode(false);
        window.location.reload();
    }

    // 5. Charger les vidéos depuis la base de données
    async function loadVideos() {
        const container = document.getElementById('videos-container');
        if (!container) return;
        
        container.innerHTML = '<p>Chargement des vidéos...</p>';

        const { data: videos, error } = await _supabase.from('videos').select('*').order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = '<p>Erreur lors du chargement des vidéos.</p>';
            return;
        }

        if (!videos || videos.length === 0) {
            container.innerHTML = '<p>Aucune vidéo publiée pour le moment.</p>';
            return;
        }

        container.innerHTML = '';
        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <img src="${video.thumb || 'https://via.placeholder.com/300x180'}" alt="${video.title}">
                <div class="video-card-content">
                    <h3>${video.title}</h3>
                    <a href="${video.link}" target="_blank">Voir la vidéo ↗</a>
                    <br>
                    <button class="btn-delete" style="display: ${isAdmin ? 'inline-block' : 'none'}; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-top: 10px;" onclick="deleteVideo(${video.id})">🗑️ Supprimer</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 6. Ajouter une vidéo en direct
    async function addVideo() {
        const title = document.getElementById('v-title').value;
        const link = document.getElementById('v-link').value;
        const thumb = document.getElementById('v-thumb').value;
        const msg = document.getElementById('admin-msg');

        if (!title || !link) {
            msg.style.color = '#ef4444';
            msg.innerText = "Remplis au moins le titre et le lien !";
            return;
        }

        const { error } = await _supabase.from('videos').insert([{ title, link, thumb }]);

        if (error) {
            msg.style.color = '#ef4444';
            msg.innerText = "Erreur : " + error.message;
        } else {
            msg.style.color = '#22c55e';
            msg.innerText = "✅ Vidéo ajoutée en direct !";
            document.getElementById('v-title').value = '';
            document.getElementById('v-link').value = '';
            document.getElementById('v-thumb').value = '';
            loadVideos();
        }
    }

    // 7. Supprimer une vidéo
    async function deleteVideo(id) {
        if (confirm("Veux-tu vraiment supprimer cette vidéo ?")) {
            await _supabase.from('videos').delete().eq('id', id);
            loadVideos();
        }
    }

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

    // Démarrage automatique
    init();
</script>
