<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitoow Editing — Portfolio</title>
    <!-- Script officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; }
        header h1 { margin: 0; font-size: 36px; color: #f8fafc; }
        header p { color: #94a3b8; font-size: 18px; }

        /* BANDEAU ADMIN (MASQUÉ PAR DÉFAUT) */
        .admin-only { display: none; }
        
        #admin-panel-bar { background-color: #1e293b; border: 2px solid #38bdf8; padding: 20px; border-radius: 12px; max-width: 800px; margin: 0 auto 40px auto; }
        #admin-panel-bar h2 { margin-top: 0; color: #38bdf8; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 14px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        
        /* GRILLE DE VIDÉOS */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
        .video-card { background-color: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
        .video-card img { width: 100%; height: 180px; object-fit: cover; }
        .video-card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-card h3 { margin: 0 0 12px 0; font-size: 18px; color: #f8fafc; }
        
        /* BOUTONS */
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .btn-primary { background-color: #0284c7; color: white; }
        .btn-primary:hover { background-color: #0369a1; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-warning { background-color: #eab308; color: #0f172a; }
        .btn-warning:hover { background-color: #ca8a04; }
        .btn-sm { padding: 6px 12px; font-size: 13px; margin-top: 8px; margin-right: 6px; }

        footer { text-align: center; margin-top: 60px; color: #64748b; font-size: 14px; }
        footer a { color: #64748b; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>Sitoow Editing 🎬</h1>
        <p>Portfolio et créations vidéos</p>
    </header>

    <!-- 🟢 BANDEAU ADMIN : APPARAÎT UNIQUEMENT SI TU ES CONNECTÉ -->
    <div id="admin-panel-bar" class="admin-only">
        <h2>
            <span>Mode Administration Actif ⚙️</span>
            <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
        </h2>
        <hr style="border-color: #334155; margin: 15px 0;">
        <h3 style="margin-top:0;">Ajouter une vidéo</h3>
        <div class="form-group">
            <label>Titre de la vidéo</label>
            <input type="text" id="new-v-title" placeholder="Ex: Montage Valorant FX">
        </div>
        <div class="form-group">
            <label>Lien de la vidéo (YouTube / TikTok / Drive)</label>
            <input type="text" id="new-v-link" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div class="form-group">
            <label>Lien de la miniature (Image)</label>
            <input type="text" id="new-v-thumb" placeholder="https://i.ytimg.com/vi/...">
        </div>
        <button class="btn btn-primary" onclick="addVideo()">Publier sur le site</button>
        <div id="admin-status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- 🎬 SECTION DES CRÉATIONS / VIDÉOS -->
    <main>
        <div class="video-grid" id="videos-container">
            <!-- Les vidéos seront chargées ici automatiquement -->
        </div>
    </main>

    <footer>
        <p>© Sitoow Editing — Tous droits réservés | <a href="admin/index.html">Accès Admin</a></p>
    </footer>

    <!-- ⚙️ SCRIPT LOGIQUE ET INTERACTION BASE DE DONNÉES -->
    <script>
        // ⚙️ TES CLÉS SUPABASE
        const SUPABASE_URL = "https://TON_PROJET.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_oWotd3kAm3ub2oAl-tHDIw_QoZzPg3R"; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isUserAdmin = false;

        // Initialisation du site
        async function initSite() {
            // Check si l'utilisateur est connecté via la session Supabase
            const { data } = await _supabase.auth.getSession();
            
            if (data && data.session) {
                isUserAdmin = true;
                // Affiche les éléments réservés à l'admin
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }

            // Charge la liste des vidéos
            loadVideos();
        }

        // Charger et afficher toutes les vidéos
        async function loadVideos() {
            const container = document.getElementById('videos-container');
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Chargement des créations...</p>';

            const { data: videos, error } = await _supabase
                .from('videos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">Erreur lors du chargement des créations.</p>';
                return;
            }

            if (!videos || videos.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Aucune création publiée pour le moment.</p>';
                return;
            }

            container.innerHTML = '';
            
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img src="${video.thumb || 'https://via.placeholder.com/300x180'}" alt="${video.title}">
                    <div class="video-card-body">
                        <h3>${video.title}</h3>
                        <div>
                            <a href="${video.link}" target="_blank" class="btn btn-primary" style="width: 100%;">Regarder</a>
                            ${isUserAdmin ? `
                                <div style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 8px;">
                                    <button class="btn btn-warning btn-sm" onclick="editVideo(${video.id}, '${video.title.replace(/'/g, "\\'")}', '${video.link}', '${video.thumb || ''}')">✏️ Modifier</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteVideo(${video.id})">🗑️ Supprimer</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Ajouter une vidéo
        async function addVideo() {
            const title = document.getElementById('new-v-title').value;
            const link = document.getElementById('new-v-link').value;
            const thumb = document.getElementById('new-v-thumb').value;
            const status = document.getElementById('admin-status');

            if (!title || !link) {
                status.style.color = '#ef4444';
                status.innerText = "Veuillez remplir au moins le titre et le lien !";
                return;
            }

            const { error } = await _supabase.from('videos').insert([{ title, link, thumb }]);

            if (error) {
                status.style.color = '#ef4444';
                status.innerText = "Erreur : " + error.message;
            } else {
                status.style.color = '#22c55e';
                status.innerText = "✅ Création ajoutée en direct !";
                document.getElementById('new-v-title').value = '';
                document.getElementById('new-v-link').value = '';
                document.getElementById('new-v-thumb').value = '';
                loadVideos();
            }
        }

        // Modifier une vidéo
        async function editVideo(id, currentTitle, currentLink, currentThumb) {
            const newTitle = prompt("Nouveau titre :", currentTitle);
            if (newTitle === null) return;

            const newLink = prompt("Nouveau lien :", currentLink);
            if (newLink === null) return;

            const newThumb = prompt("Nouveau lien de miniature :", currentThumb);
            if (newThumb === null) return;

            const { error } = await _supabase
                .from('videos')
                .update({ title: newTitle, link: newLink, thumb: newThumb })
                .eq('id', id);

            if (error) {
                alert("Erreur lors de la modification : " + error.message);
            } else {
                loadVideos();
            }
        }

        // Supprimer une vidéo
        async function deleteVideo(id) {
            if (confirm("Voulez-vous vraiment supprimer cette création ?")) {
                const { error } = await _supabase.from('videos').delete().eq('id', id);
                if (error) {
                    alert("Erreur lors de la suppression : " + error.message);
                } else {
                    loadVideos();
                }
            }
        }

        // Déconnexion
        async function logout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        // Lancement au chargement de la page
        initSite();
    </script>
</body>
</html>
