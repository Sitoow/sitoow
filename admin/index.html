<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .error { color: #ef4444; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connexion Admin</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
        <p class="error" id="err-msg"></p>
    </div>

    <script>
        // ⚙️ Tes clés Supabase
        const SUPABASE_URL = "https://TON_PROJET.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_oWotd3kAm3ub2oAl-tHDIw_QoZzPg3R"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Si tu es déjà connecté, redirige tout de suite sur le site principal
        async function checkSession() {
            const { data } = await _supabase.auth.getSession();
            if (data && data.session) {
                window.location.href = "../index.html";
            }
        }
        checkSession();

        // Se connecter et rediriger vers le site principal
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errMsg = document.getElementById('err-msg');

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errMsg.innerText = "Identifiants incorrects !";
            } else {
                // REDIRECTION VERS LE SITE PRINCIPAL EN MODE ADMIN
                window.location.href = "../index.html";
            }
        }
    </script>
</body>
</html>
