<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Mode Admin — Sitoow Editing</title>
    <!-- Script officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; font-size: 22px; color: #f0f6fc; text-align: center; margin-bottom: 24px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 10px 12px; margin-bottom: 16px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #f0f6fc; font-size: 14px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { width: 100%; padding: 12px; background-color: #238636; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2ea043; }
        .error-message { color: #f85149; font-size: 13px; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Espace Admin 🎬</h1>
        
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="ton-email@exemple.com">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••">

        <button onclick="login()">Se connecter</button>
        
        <div id="error-message" class="error-message"></div>
    </div>

    <script>
        // ⚙️ TES CLÉS SUPABASE (À remplacer avec tes vraies infos)
        const SUPABASE_URL = "https://TON_PROJET.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_oWotd3kAm3ub2oAl-tHDIw_QoZzPg3R"; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Si tu es déjà connecté, redirige directement sur le site principal
        async function checkExistingSession() {
            const { data } = await _supabase.auth.getSession();
            if (data && data.session) {
                window.location.href = "../index.html";
            }
        }
        checkExistingSession();

        // Fonction de connexion
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('error-message');

            errorElement.innerText = "";

            if (!email || !password) {
                errorElement.innerText = "Veuillez remplir tous les champs.";
                return;
            }

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorElement.innerText = "Identifiants incorrects !";
            } else {
                // REDIRECTION AUTOMATIQUE VERS LE SITE PRINCIPAL
                window.location.href = "../index.html";
            }
        }
    </script>
</body>
</html>
